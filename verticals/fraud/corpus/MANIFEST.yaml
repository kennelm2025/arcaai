# ArcaAI B7 corpus manifest — the sole governing artefact for corpus
# identity, licence, SA5 classification and retrieval eligibility
# (DEC-0014). Postgres holds only load snapshots and must never be
# used to regenerate this file.
#
# Rules (DEC-0014, enforced mechanically by the loader):
#   - Identity fields (id, source, licence, sa5_classification,
#     content_sha256) are immutable once a document is listed. A
#     revised source document is a NEW entry with a new sha256.
#   - licence is one of: synthetic-arcaai | OGL-v3.0 (DEC-0011).
#   - eligibility is an append-only list of dated transitions
#     (state: included | pending_review | withdrawn | deprecated).
#     Deleting, modifying or reordering historical transitions is a
#     hard load failure. A mutable flag is prohibited.
#   - processing fields (chunker_version, embedding_model,
#     chunk_count, ingest_timestamp) may change with a manifest
#     version bump; identity fields may not.
#   - manifest_version is a human label only; identity is the
#     canonical content hash.
#
# Version note (2026-07-28.2): the two schema-establishing
# placeholders of 2026-07-28.1 are REPLACED by the twelve reviewed
# synthetic seed documents. Replacement is legal only because no
# manifest version has ever been loaded (no corpus_version snapshot
# exists); after first load, document removal is an AppendOnlyViolation
# by design. Documents authored per DEC-0011(a); panel-reviewed
# (accepted 2026-07-28); files at verticals/fraud/corpus/documents/.
# The OGL-v3.0 subset per DEC-0011(b) joins in a subsequent version.
#
# Version note (2026-07-28.3): operator inclusion decision — all twelve
# synthetic seed documents transition to included, panel review having
# accepted the set on 2026-07-28. Appended transitions only; nothing
# above is modified (DEC-0014 item 5).
#
# Version note (2026-07-28.4): the OGL-v3.0 subset per DEC-0011(b) —
# four extracts fetched from legislation.gov.uk data.xht endpoints
# (content-only, no site chrome), hashes computed on the operator's
# machine at fetch. Crown copyright, reused under the Open Government
# Licence v3.0; text unmodified per DEC-0011 (no paraphrasing of OGL
# material). Listed at pending_review; inclusion is a separate
# governed act. Appended entries only; nothing above is modified.

# Version note (2026-07-28.5): operator inclusion decision — all four
# OGL-v3.0 extracts transition to included; decision recorded
# 2026-07-28. Review basis, recorded per that decision: OGL-0001 read
# in full; licence and data.xht endpoint uniform across the set;
# OGL-0002..0004 not individually read. Appended transitions only;
# nothing above is modified (DEC-0014 item 5).

