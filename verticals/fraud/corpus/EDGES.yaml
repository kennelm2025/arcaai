# B7 corpus citation edges - the v0.2 skeleton's planned outbound
# citations for all 38 new documents (skeleton v0.2, operator-approved
# 2026-07-30). This file is the design source for the closure /
# asymmetry / immutability check (scripts/corpus_edges_check.py).
# v0.2.1: nine closure-repair edges approved by operator
# 2026-07-30 after the mechanical check found nine documents
# without design inbound (TY-05/08/09, DL-04/05, DP-04,
# CV-04/05/06) - the v0.2 closure eyeball was wrong; the check
# caught it on first run.
# v0.2.2: two batch-1 panel-ruled promotions (operator rulings
# 2026-08-06, docs/governance/RULINGS_RECORD_2026-08-06_batch1.md):
# CV-01 into TY-04's minimum set (coercion indicators structural to
# the exit-decision framework; two-reviewer support) and TR-01 into
# TY-07's (the section-5.3 data-completeness dependency). Both edges
# already present in the authored prose — no document amendment.
# SG-01/SG-02 promotion for TY-04 was DECLINED (remain extras;
# dissent recorded in the rulings record).
#
#
# Semantics: each list is the MINIMUM outbound citation set - every
# listed edge must appear in the authored prose. Additional citations
# are permitted where register-legal (an Authority document may never
# cite a firm document) and are reported by the check for panel
# visibility, not failed.
#
# The existing sixteen (12 SYN + 4 OGL) appear as targets only: their
# outbound edges are committed and unchangeable (new-entry-new-hash),
# and OGL statutes emit nothing by design (citation sinks).

